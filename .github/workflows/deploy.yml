name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build
        working-directory: apps/api

      - name: Build Web
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3003
          NEXT_PUBLIC_WS_URL: https://kazilink.online

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 64.225.100.156 >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='apps/api/.env' \
            --exclude='apps/api/.env.*' \
            --exclude='apps/web/.env' \
            --exclude='apps/web/.env.*' \
            --exclude='apps/web/.next/cache' \
            --exclude='uploads' \
            ./ root@64.225.100.156:/var/www/erpgkk/

      - name: Install production deps and restart
        run: |
          ssh root@64.225.100.156 << 'ENDSSH'
            set -e
            cd /var/www/erpgkk
            npm install --omit=dev --legacy-peer-deps
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
          ENDSSH

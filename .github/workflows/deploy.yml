name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build
        working-directory: apps/api

      - name: Build Web
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3003
          NEXT_PUBLIC_WS_URL: https://kazilink.online

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 64.225.100.156 >> ~/.ssh/known_hosts

      - name: Prune to production dependencies
        run: npm prune --omit=dev

      - name: Sync to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='apps/api/.env' \
            --exclude='apps/api/.env.*' \
            --exclude='apps/web/.env' \
            --exclude='apps/web/.env.*' \
            --exclude='apps/web/.next/cache' \
            --exclude='uploads' \
            ./ root@64.225.100.156:/var/www/erpgkk/

      - name: Restart services
        run: |
          ssh root@64.225.100.156 "
            export NVM_DIR=/root/.nvm
            source \$NVM_DIR/nvm.sh
            cd /var/www/erpgkk
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
          "

      - name: Ensure Apache WebSocket proxy
        run: |
          ssh root@64.225.100.156 "
            a2enmod proxy proxy_http proxy_wstunnel rewrite 2>/dev/null || true
            CONFIG=\$(grep -rl 'kazilink.online' /etc/apache2/sites-enabled/ 2>/dev/null | head -1)
            if [ -n \"\$CONFIG\" ] && ! grep -q 'socket.io' \"\$CONFIG\"; then
              sed -i 's|</VirtualHost>|  # Socket.IO WebSocket proxy\n  RewriteEngine On\n  RewriteCond %{HTTP:Upgrade} websocket [NC]\n  RewriteCond %{HTTP:Connection} upgrade [NC]\n  RewriteRule ^/socket\\.io/(.*) ws://localhost:3003/socket.io/\$1 [P,L]\n  ProxyPass /socket.io/ http://localhost:3003/socket.io/\n  ProxyPassReverse /socket.io/ http://localhost:3003/socket.io/\n</VirtualHost>|' \"\$CONFIG\"
              systemctl reload apache2
              echo \"Apache WebSocket proxy added and reloaded\"
            else
              echo \"WebSocket proxy already configured or config not found\"
            fi
          "

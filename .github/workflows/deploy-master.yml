name: Deploy to ops.kwikkoders.com

on:
  push:
    branches: [master]

jobs:
  # Gate. `next build` loads postcss.config.js, so a compromised config executes
  # on this runner alongside the deploy key — scan before anything is built.
  security-scan:
    uses: ./.github/workflows/security-malware-scan.yml

  deploy:
    needs: security-scan
    if: ${{ needs.security-scan.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @gkkerp/api build

      - name: Build Web
        run: pnpm --filter @gkkerp/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3003
          NEXT_PUBLIC_WS_URL: https://ops.kwikkoders.com

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: SSH_PRIVATE_KEY_PROD secret is not set in GitHub repository secrets."
            exit 1
          fi
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf 'Host 109.199.96.234\n  User maic\n  Port 2245\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  IdentityFile ~/.ssh/id_rsa\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY_PROD }}

      - name: Prune to production dependencies
        run: |
          # pnpm prune can drop gitignored build output (dist / .next).
          # Keep the compiled API and Next.js app so production is not
          # left running a stale PM2 process without standup-notes routes.
          tar -cf /tmp/erpgkk-build.tar apps/api/dist apps/web/.next
          test -f apps/api/dist/hr/standup-notes/standup-notes.controller.js
          pnpm prune --prod
          tar -xf /tmp/erpgkk-build.tar
          test -f apps/api/dist/hr/standup-notes/standup-notes.controller.js
          test -d apps/web/.next

      - name: Verify server prerequisites
        run: |
          ssh maic@109.199.96.234 '
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ ! -s "$NVM_DIR/nvm.sh" ] || . "$NVM_DIR/nvm.sh"
            test -d /var/www/erpgkk
            test -w /var/www/erpgkk
            command -v pm2 >/dev/null
          '

      - name: Sync app to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='apps/api/.env' \
            --exclude='apps/api/.env.*' \
            --exclude='apps/web/.env' \
            --exclude='apps/web/.env.*' \
            --exclude='apps/web/.next/cache' \
            --exclude='uploads' \
            ./ maic@109.199.96.234:/var/www/erpgkk/

      - name: Restart services
        run: |
          ssh maic@109.199.96.234 '
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ ! -s "$NVM_DIR/nvm.sh" ] || . "$NVM_DIR/nvm.sh"

            # Ensure uploads directory exists
            mkdir -p /var/www/erpgkk/uploads

            cd /var/www/erpgkk
            test -f apps/api/dist/hr/standup-notes/standup-notes.controller.js
            test -f apps/api/dist/main.js

            # Delete + start so PM2 cannot keep an old cwd/process whose
            # dist predates standup-notes (startOrReload leaves it running
            # when the new start fails).
            pm2 delete gkkerp-api gkkerp-web || true
            pm2 start ecosystem.config.js --update-env
            pm2 save

            sleep 3
            port=$(sed -n 's/^PORT=//p' apps/api/.env | tr -d '"')
            port=${port:-3001}
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${port}/api/hr/standup-notes" || true)
            echo "API :${port} /api/hr/standup-notes -> ${code}"
            if [ "$code" != "401" ]; then
              echo "ERROR: standup-notes route is missing after deploy"
              pm2 describe gkkerp-api || true
              pm2 logs gkkerp-api --lines 50 --nostream || true
              exit 1
            fi

            echo "Deploy complete"
          '

name: Deploy to ops.kwikkoders.com

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build
        working-directory: apps/api

      - name: Build Web
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3003
          NEXT_PUBLIC_WS_URL: https://ops.kwikkoders.com

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: SSH_PRIVATE_KEY_PROD secret is not set in GitHub repository secrets."
            exit 1
          fi
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf 'Host 109.199.96.234\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  IdentityFile ~/.ssh/id_rsa\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY_PROD }}

      - name: Prune to production dependencies
        run: npm prune --omit=dev

      - name: Sync app to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='apps/api/.env' \
            --exclude='apps/api/.env.*' \
            --exclude='apps/web/.env' \
            --exclude='apps/web/.env.*' \
            --exclude='apps/web/.next/cache' \
            --exclude='uploads' \
            ./ root@109.199.96.234:/var/www/erpgkk/

      - name: Install Nginx config
        run: |
          scp deploy/nginx/ops.kwikkoders.com \
            root@109.199.96.234:/etc/nginx/sites-available/ops.kwikkoders.com

      - name: Bootstrap server and restart services
        run: |
          ssh root@109.199.96.234 '
            set -e

            # Fix Git dubious ownership if someone runs git commands on the server
            git config --global --add safe.directory /var/www/erpgkk 2>/dev/null || true

            # Ensure uploads directory exists
            mkdir -p /var/www/erpgkk/uploads

            # Install PM2 globally if missing
            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            # Enable Nginx site and reload
            ln -sf /etc/nginx/sites-available/ops.kwikkoders.com \
                   /etc/nginx/sites-enabled/ops.kwikkoders.com
            nginx -t && systemctl reload nginx

            # Start / reload app processes
            cd /var/www/erpgkk
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
            pm2 startup systemd -u root --hp /root 2>/dev/null || true

            echo "Deploy complete"
          '
